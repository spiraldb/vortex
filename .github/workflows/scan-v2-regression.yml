name: Scan V2 Regression Comparison
run-name: Scan V2 regression comparison on ${{ github.ref_name }}

on:
  push:
    branches: ["ji/scan-v2-list-confirm-ci"]
  workflow_dispatch: { }

permissions:
  contents: read

concurrency:
  group: scan-v2-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.repository == 'vortex-data/vortex'
    timeout-minutes: 180
    runs-on: >-
      runs-on=${{ github.run_id }}/runner=bench-dedicated/family=c8gd.8xlarge/image=ubuntu24-full-arm64-pre-v2/extras=s3-cache/tag=scan-v2-regression
    env:
      # Checkpoints before list masks and before retaining null-row payload.
      BASELINE_COMMIT: "80707e040645eb32e1b6ee8e68359dcc5b64b08b"
      MASK_COMMIT: "e3d88b5abbb23e63183e89ff008ae742fd583900"
      CARGO_BUILD_JOBS: "8"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
      RUST_LOG: warn
    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-prebuild
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-sccache: "true"
      - uses: ./.github/actions/system-info

      - name: Build current scan and data preparation binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-v2-binaries scan-v2-results
          env -u VORTEX_SELECTION_METRICS cargo build --locked --profile release_debug \
            -p vortex --example selection_scan --example generate_list_fixture
          cp target/release_debug/examples/selection_scan scan-v2-binaries/current
          cp target/release_debug/examples/generate_list_fixture scan-v2-binaries/generate-lists

      - name: Build both pinned predecessors
        shell: bash
        run: |
          set -euo pipefail
          for entry in "baseline:$BASELINE_COMMIT" "mask:$MASK_COMMIT"; do
            name="${entry%%:*}"
            revision="${entry#*:}"
            git worktree add --detach "$RUNNER_TEMP/scan-v2-$name" "$revision"
            (
              cd "$RUNNER_TEMP/scan-v2-$name"
              env -u VORTEX_SELECTION_METRICS cargo build --locked --profile release_debug \
                -p vortex --example selection_scan
            )
            cp target/release_debug/examples/selection_scan "scan-v2-binaries/$name"
          done
          sha256sum scan-v2-binaries/* > scan-v2-results/binaries.sha256

      - name: Isolate benchmark CPUs
        run: sudo bash scripts/setup-benchmark.sh

      - name: Confirm singleton regressions with 4096-query rounds
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/bench-taskset.sh python3 scripts/scan-v2-large-lists.py \
            --baseline scan-v2-binaries/baseline \
            --candidate scan-v2-binaries/current \
            --intermediate scan-v2-binaries/mask \
            --intermediate-commit "$MASK_COMMIT" --confirm-singletons \
            --generator scan-v2-binaries/generate-lists \
            --baseline-commit "$BASELINE_COMMIT" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            | tee scan-v2-results/large-lists.log

      - name: Upload results, raw samples, and layout metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scan-v2-list-confirm-${{ github.sha }}
          path: scan-v2-results/
          if-no-files-found: warn
